[package]
name = "maneki"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["image-without-codecs", "tokio", "canvas"] }
libloading = "0.9.0"
rfd = "0.17.2"
# 音频播放（视频和其余音频格式还是 libmpv；rodio 只管纯音频，省得为了一首歌
# 也去起一套 libmpv 的软渲染）
#
# **只留 mp3 和 wav**，其余一律交给 mpv。挑的标准不是「解不解得开」，而是
# 「拖不拖得动进度条」—— rodio 0.19 里能 seek 的只有这两个后端：
#
#   mp3  = symphonia-mp3   → symphonia 的 demuxer seek，实测能用
#   wav  = hound           → 自己按采样数定位，实测能用
#
# 踩过的坑（都实测过，别想着再开回来）：
#
# - **flac**：原生后端 claxon 的 `try_seek` 是 `Err(NotSupported)`；
#   换 symphonia-flac 也不行 —— 它二分查找要 `MediaSourceStream::byte_len()`，
#   而 rodio 包源的 `ReadSeekSource::byte_len()` 恒为 `None` → `Unseekable`。
#   这条路是 rodio 自己堵死的，除非不用 rodio::Decoder。
# - **m4a / aac**（symphonia-isomp4）：初始化阶段抛 SeekError 时 rodio 走的是
#   `unreachable!()`，直接 panic，整条播放线程没了 —— 表现是「一点声音都没有」，
#   比不能 seek 严重得多。
# - **ogg / vorbis**：lewton 的 seek 同样没实现。
#
# `minimp3` 也不能开：它的 `try_seek` 也是 NotSupported（源码里留着 TODO）。
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }

# 音频的封面 / 歌词 / 曲名歌手：读标签只认 lofty（ID3、Vorbis、MP4、APE 一把抓）。
# iced 开的是 `image-without-codecs`（它自己不解码），所以封面得我们自己解：
# 只要 jpeg + png 两个解码器，其余格式关掉，省得白拉一堆依赖进来。
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# 给 exe 塞图标 + 版本信息（build.rs 里用）
[build-dependencies]
embed-resource = "3.0"

# 视频播放依赖热点循环（像素拷贝、RGB 转换），debug 下需要优化否则掉帧
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# ---------------- 安装包 ----------------
#
# `cargo packager --release` 在 dist\ 下生成 Maneki_<版本>_x64-setup.exe。
# 版本号唯一来源是上面 [package] 的 version，打包脚本（package.ps1）负责改它。
[package.metadata.packager]
productName = "Maneki"
identifier = "com.maneki.player"
description = "极速打开、全格式解码的 Windows 视频播放器"
authors = ["Maneki"]
icons = ["assets/logo.ico"]
formats = ["nsis"]
outDir = "dist"
# exe 只有 11 MB，真正干活的是这个解码库，必须跟主程序装进同一个目录
resources = ["vendor/libmpv-2.dll"]

[package.metadata.packager.nsis]
installerIcon = "assets/logo.ico"
# 安装界面说中文。NSIS 自带 SimpChinese 语言文件，这里只要点名即可。
languages = ["SimpChinese"]
# 不管用户在安装向导里选哪个目录，程序最后都落在它自己的子目录里：
#   D:\Program Files\maneki        ->  D:\Program Files\maneki\Maneki
#   D:\Program Files\maneki\       ->  D:\Program Files\maneki\Maneki
#   D:\Program Files\maneki\Maneki  ->  原样不动
# 把 exe 和 uninstall.exe 直接撒在 D:\Downloads 里，以后想清理都不知道删哪些。
#
# cargo-packager 没有「目录页回调」这种配置，只能挂 `preinstallSection`
# —— 它以一段普通 Section 的形式插在 `Section Install` 之前，此时目录页早就
# 结束、$INSTDIR 就是用户最后选的那个路径，正好可以在这里补一层子目录。
# 下面的写法用 `${PRODUCTNAME}` 而不是硬编码 "Maneki"，改产品名时不用同步改这里。
preinstallSection = '''
Section DirSuffix
  ; 从资源管理器复制来的路径常常带个尾巴反斜杠，先削掉，
  ; 不然会拼成 D:\foo\\Maneki。
  StrCpy $R9 $INSTDIR 1 -1
  StrCmp $R9 "\" 0 +2
    StrCpy $INSTDIR $INSTDIR -1

  ; 最后一段已经是产品名就不再套一层（StrCmp 不分大小写），
  ; 免得装出 ...\Maneki\Maneki。
  StrLen $R8 "\${PRODUCTNAME}"
  IntOp $R8 0 - $R8
  StrCpy $R9 $INSTDIR "" $R8
  StrCmp $R9 "\${PRODUCTNAME}" done
  StrCpy $INSTDIR "$INSTDIR\${PRODUCTNAME}"
  done:
SectionEnd
'''

